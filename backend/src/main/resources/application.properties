spring.application.name=prakashstores
server.port=8080
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
management.endpoints.web.exposure.include=health,info
jwt.secret=${JWT_SECRET:ZGVtby1vbmx5LXNlY3JldC1rZXktZm9yLWxvY2FsLXRlc3RpbmctY2hhbmdlLWluLXByb2R1Y3Rpb24tZW52aXJvbm1lbnQ=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
admin.email=${ADMIN_EMAIL:owner@yourbusiness.com}
admin.phone=${ADMIN_PHONE:+910000000000}
admin.password=${ADMIN_PASSWORD:changeme123}
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
# S3-compatible object storage (MinIO self-hosted by default; point at AWS S3 by changing these).
s3.endpoint=${S3_ENDPOINT:http://minio:9000}
s3.region=${S3_REGION:us-east-1}
s3.bucket=${S3_BUCKET:media}
s3.access-key=${S3_ACCESS_KEY:minioadmin}
s3.secret-key=${S3_SECRET_KEY:minioadmin}
s3.path-style=${S3_PATH_STYLE:true}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:10MB}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
management.health.mail.enabled=false
